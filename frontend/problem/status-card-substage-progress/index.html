<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Status Card Smoke</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { margin: 0; background: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .smoke-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding: 24px; align-items: start; }
    .smoke-case { display: grid; gap: 10px; justify-items: center; }
    .smoke-title { font-size: 14px; font-weight: 700; color: #1d1d1f; }
    job-status-card { display: block; width: 540px; max-width: 100%; }
    job-status-card.status-card.hidden { display: block !important; }
  </style>
</head>
<body>
  <main class="smoke-grid">
    <section class="smoke-case"><div class="smoke-title">OCR: provider_processing 28/33</div><job-status-card id="ocr-card"></job-status-card></section>
    <section class="smoke-case"><div class="smoke-title">翻译: page_policies 3/10</div><job-status-card id="translate-card"></job-status-card></section>
    <section class="smoke-case"><div class="smoke-title">渲染: render_compile 1/4</div><job-status-card id="render-card"></job-status-card></section>
  </main>
  <script type="module">
    import "/src/js/components/status/job-status-card.js";

    const common = {
      status: "running",
      elapsed: "1分20秒",
      cancelEnabled: true,
      backHomeVisible: false,
      progressFallbackText: "-",
      stageProgressByKey: {},
      stageRetryActions: {},
    };

    customElements.whenDefined("job-status-card").then(() => {
      document.querySelector("#ocr-card").renderSnapshot({
        ...common,
        jobId: "ocr-smoke",
        label: "第 1/4 步 · OCR 解析",
        value: "正在执行云端 OCR",
        stageKey: "ocr",
        visualStageKey: "ocr_processing",
        progressCurrent: 28,
        progressTotal: 33,
        progressText: "第 28/33 页",
        progressUnit: "page",
        substageKey: "ocr_processing",
        stageProgressByKey: {
          ocr: { current: 28, total: 33, progressText: "第 28/33 页", progressUnit: "page", substageKey: "ocr_processing", visualStageKey: "ocr_processing" },
        },
      });
      document.querySelector("#translate-card").renderSnapshot({
        ...common,
        jobId: "translate-smoke",
        label: "第 2/4 步 · 页面策略",
        value: "正在判断正文与保留排版内容",
        stageKey: "translate",
        visualStageKey: "translate",
        progressCurrent: 3,
        progressTotal: 10,
        progressText: "第 3/10 页",
        progressUnit: "page",
        substageKey: "page_policies",
        stageProgressByKey: {
          translate: {
            current: 120,
            total: 900,
            progressText: "第 120/900 批",
            progressUnit: "batch",
            substageKey: "translation_batches",
            visualStageKey: "translate",
            bySubstage: {
              translation_batches: { current: 120, total: 900, progressText: "第 120/900 批", progressUnit: "batch", substageKey: "translation_batches" },
              page_policies: { current: 3, total: 10, progressText: "第 3/10 页", progressUnit: "page", substageKey: "page_policies" },
            },
          },
        },
      });
      document.querySelector("#render-card").renderSnapshot({
        ...common,
        jobId: "render-smoke",
        label: "第 3/4 步 · 渲染",
        value: "正在编译 PDF",
        stageKey: "render",
        visualStageKey: "render_compile",
        progressCurrent: 85,
        progressTotal: 100,
        progressText: "编译 1/4",
        progressUnit: "percent",
        substageKey: "render_compile",
        stageProgressByKey: {
          render: { current: 85, total: 100, progressText: "编译 1/4", progressUnit: "percent", substageKey: "render_compile", visualStageKey: "render_compile" },
        },
      });
      window.__STATUS_CARD_SMOKE_READY__ = true;
      setTimeout(() => {
        const result = [...document.querySelectorAll("job-status-card")].map((card) => ({
          id: card.id,
          activeStage: [...card.querySelectorAll(".status-stage-step")]
            .find((el) => el.classList.contains("is-active"))?.dataset.stageKey || "",
          activeSubstage: [...card.querySelectorAll(".status-substage-step")]
            .find((el) => el.classList.contains("is-active"))?.dataset.substageKey || "",
          substageCount: card.querySelectorAll(".status-substage-step").length,
          detail: card.querySelector("#status-stage-detail")?.textContent?.trim() || "",
          progressText: card.querySelector("#job-progress-text")?.textContent?.trim() || "",
          progressWidth: card.querySelector("#job-progress-bar")?.style?.width || "",
          visualStageKey: card.dataset.visualStageKey || "",
        }));
        const output = document.createElement("pre");
        output.id = "smoke-result";
        output.textContent = JSON.stringify(result, null, 2);
        output.style.display = "none";
        document.body.appendChild(output);
      }, 300);
    });
  </script>
</body>
</html>
