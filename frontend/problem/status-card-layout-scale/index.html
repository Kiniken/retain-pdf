<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Status Card Layout Scale</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .translation-workflow-dialog {
      display: grid !important;
    }

    .translation-workflow-card {
      display: none !important;
    }

    .translation-status-panel {
      display: grid !important;
    }
  </style>
</head>
<body>
  <div id="translation-workflow-dialog" class="translation-workflow-dialog is-status-mode" role="dialog" aria-modal="true" aria-labelledby="translation-workflow-title">
    <div class="desktop-shell translation-workflow-shell">
      <div class="translation-workflow-head">
        <h2 id="translation-workflow-title">任务进度</h2>
        <button type="button" class="dialog-close-btn" aria-label="关闭">×</button>
      </div>
      <section class="translation-workflow-card"></section>
      <section id="status-section" class="translation-status-panel" aria-label="任务进度">
        <job-status-card id="job-status-card"></job-status-card>
      </section>
    </div>
  </div>

  <script type="module">
    import "/src/js/components/status/job-status-card.js";

    const snapshot = {
      jobId: "layout-scale-smoke",
      status: "running",
      elapsed: "2分18秒",
      cancelEnabled: true,
      backHomeVisible: false,
      label: "第 2/4 步 · 翻译",
      value: "正在执行全书翻译",
      stageKey: "translate",
      visualStageKey: "translate",
      progressCurrent: 428,
      progressTotal: 5216,
      progressText: "第 428/5216 批",
      progressUnit: "batch",
      substageKey: "translation_batches",
      progressFallbackText: "-",
      stageProgressByKey: {
        ocr: {
          current: 533,
          total: 533,
          progressText: "第 533/533 页",
          progressUnit: "page",
          substageKey: "normalizing",
          visualStageKey: "ocr_processing",
        },
        translate: {
          current: 428,
          total: 5216,
          progressText: "第 428/5216 批",
          progressUnit: "batch",
          substageKey: "translation_batches",
          visualStageKey: "translate",
          bySubstage: {
            translation_prepare: { current: 1, total: 1, progressText: "准备完成", progressUnit: "step", substageKey: "translation_prepare" },
            domain_inference: { current: 1, total: 1, progressText: "领域识别完成", progressUnit: "step", substageKey: "domain_inference" },
            page_policies: { current: 533, total: 533, progressText: "第 533/533 页", progressUnit: "page", substageKey: "page_policies" },
            continuation_review: { current: 533, total: 533, progressText: "第 533/533 页", progressUnit: "page", substageKey: "continuation_review" },
            translation_batches: { current: 428, total: 5216, progressText: "第 428/5216 批", progressUnit: "batch", substageKey: "translation_batches" },
          },
        },
      },
      stageRetryActions: {},
    };

    customElements.whenDefined("job-status-card").then(() => {
      const card = document.querySelector("#job-status-card");
      card.renderSnapshot(snapshot);
      card.classList.remove("hidden");
      window.__STATUS_CARD_LAYOUT_READY__ = true;
      setTimeout(() => {
        const selectors = [
          ".translation-workflow-shell",
          ".translation-status-panel",
          "job-status-card",
          ".status-head",
          ".status-focus-card",
          ".status-stage-flow",
          ".status-focus-body",
          ".status-stage-animation",
          ".status-substage-flow",
          ".status-progress-block",
          ".status-card-footer",
        ];
        const metrics = Object.fromEntries(selectors.map((selector) => {
          const el = document.querySelector(selector);
          if (!el) {
            return [selector, null];
          }
          const rect = el.getBoundingClientRect();
          const style = getComputedStyle(el);
          return [selector, {
            x: Math.round(rect.x),
            y: Math.round(rect.y),
            width: Math.round(rect.width),
            height: Math.round(rect.height),
            gap: style.gap,
            padding: style.padding,
          }];
        }));
        const output = document.createElement("pre");
        output.id = "layout-metrics";
        output.textContent = JSON.stringify(metrics, null, 2);
        output.style.display = "none";
        document.body.appendChild(output);
      }, 300);
    });
  </script>
</body>
</html>
